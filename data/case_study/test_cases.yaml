test_cases:
  - id: TC-001
    title: Verify seat-belt warning activation
    verifies: SSR-001
    status: approved
    preconditions:
      - Warning function is operational.
      - Input signals are valid.
    inputs:
      driver_seat: occupied
      driver_seat_belt: not_fastened
      vehicle_speed_kmh: 15
    expected_result: >
      The seat-belt warning shall be active.

  - id: TC-002
    title: Verify seat-belt warning activation time
    verifies: SSR-002
    status: approved
    preconditions:
      - Warning function is operational.
      - Input signals are valid.
    inputs:
      driver_seat: occupied
      driver_seat_belt: not_fastened
      vehicle_speed_kmh: 15
    measurement:
      response_time_ms: measured
    expected_result: >
      The seat-belt warning shall become active within 500 ms
      after the activation conditions are satisfied.

  - id: TC-003
    title: Verify unavailable belt-status signal handling
    verifies: SSR-003
    status: approved
    preconditions:
      - Warning function is operational.
      - Diagnostic function is operational.
    inputs:
      driver_seat_belt_signal: unavailable
    expected_result: >
      The system shall report a seat-belt status fault.

  - id: TC-004
    title: Verify seat-belt warning deactivation
    verifies: SSR-004
    status: approved
    preconditions:
      - Warning function is operational.
      - Seat-belt warning is active.
    inputs:
      driver_seat_belt: fastened
    expected_result: >
      The system shall deactivate the seat-belt warning.

  - id: TC-005
    title: Verify visual warning indication
    verifies: SSR-005
    status: approved
    preconditions:
      - Warning function is operational.
      - Seat-belt warning is active.
    expected_result: >
      The system shall provide a visual warning indication to the driver.

  - id: TC-006
    title: Verify warning state after system restart
    verifies: SSR-006
    status: approved
    preconditions:
      - Warning function is operational.
      - Valid seat occupancy, seat-belt status, and vehicle speed inputs are available.
    test_steps:
      - Restart the system.
      - Allow the warning function to evaluate the current input signals.
    expected_result: >
      The system shall determine the seat-belt warning state using the
      current seat occupancy, seat-belt status, and vehicle speed inputs.